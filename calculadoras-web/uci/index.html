<style>
  :root{
    --bg:#070b16; --panel:#0e1830; --panel2:#111d38; --line:#22314f;
    --ink:#e8eef8; --muted:#8aa0c4; --cyan:#22d3ee; --violet:#8b5cf6;
    --ok:#38d39f; --warn:#f5b544; --bad:#f5566b; --accent:#22d3ee;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:radial-gradient(1100px 600px at 50% -10%, rgba(139,92,246,.16), transparent 60%), var(--bg);
    color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100dvh;
    padding:max(14px,env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom));
  }
  .app{max-width:680px; margin:0 auto}
  header{text-align:center; margin:6px 0 14px}
  h1{font-size:1.4rem; font-weight:800; letter-spacing:-.02em; margin:0;
    background:linear-gradient(92deg,var(--cyan),var(--violet)); -webkit-background-clip:text; background-clip:text; color:transparent}
  .sub{color:var(--muted); font-size:.74rem; letter-spacing:.14em; text-transform:uppercase; margin:4px 0 0}
  .tabs{display:flex; gap:7px; overflow-x:auto; padding:4px 2px 10px; scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto; background:var(--panel); border:1px solid var(--line); color:var(--muted);
    padding:9px 13px; border-radius:12px; font-size:.86rem; font-weight:600; cursor:pointer; white-space:nowrap; transition:.15s}
  .tab.on{color:#04121f; background:linear-gradient(92deg,var(--cyan),var(--violet)); border-color:transparent}
  section{display:none}
  section.on{display:block; animation:f .2s ease}
  @keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line);
    border-radius:16px; padding:14px 14px 16px; margin-bottom:14px}
  .card h2{font-size:1rem; margin:0 0 10px; display:flex; align-items:center; gap:8px}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .grid.one{grid-template-columns:1fr}
  .f{display:flex; flex-direction:column; gap:4px}
  .f label{font-size:.76rem; color:var(--muted); font-weight:600}
  .f input,.f select{background:#0a1424; border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:10px; font-size:1rem; width:100%; -webkit-appearance:none}
  .f input:focus,.f select:focus{outline:2px solid var(--cyan); border-color:transparent}
  .seg{display:flex; gap:6px; flex-wrap:wrap}
  .seg button{flex:1; min-width:64px; background:#0a1424; border:1px solid var(--line); color:var(--muted);
    padding:8px; border-radius:9px; font-size:.82rem; cursor:pointer}
  .seg button.on{background:rgba(34,211,238,.16); border-color:var(--cyan); color:var(--ink)}
  .out{margin-top:12px; background:#0a1424; border:1px solid var(--line); border-radius:12px; padding:12px}
  .r{display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:7px 0; border-bottom:1px dashed rgba(255,255,255,.07)}
  .r:last-child{border-bottom:0}
  .r .k{font-size:.86rem; color:var(--muted)}
  .r .v{font-size:1.16rem; font-weight:800; font-variant-numeric:tabular-nums; text-align:right}
  .r .v small{font-size:.72rem; font-weight:600; color:var(--muted)}
  .pill{display:inline-block; padding:2px 9px; border-radius:999px; font-size:.74rem; font-weight:700; margin-left:6px}
  .pill.ok{background:rgba(56,211,159,.16); color:var(--ok)}
  .pill.warn{background:rgba(245,181,68,.16); color:var(--warn)}
  .pill.bad{background:rgba(245,86,107,.18); color:var(--bad)}
  .note{font-size:.72rem; color:var(--muted); margin-top:9px; line-height:1.5}
  .note b{color:#aab8d4}
  .hint{font-size:.72rem;color:var(--muted);margin:-4px 0 8px}
  footer{text-align:center;color:var(--muted);font-size:.7rem;margin-top:8px;line-height:1.6}
</style>
</head>

   NEGATIVO, físicamente imposible, y se imprimía igual.
   Los topes son generosos a propósito: marcan lo IMPOSIBLE, no lo infrecuente.

   dejarle trabajar. */

  n_kg:[1,350,'peso kg'], p_kg:[1,350,'peso kg'], e_kg:[1,350,'peso kg'],

/* Devuelve el aviso si el valor es imposible, o null si se puede usar. */
function fueraDeRango(id){
  const r = RANGOS[id]; if(!r) return null;
  const v = parseFloat((el(id)||{}).value);
  if(isNaN(v)) return null;                       // vacío no es un error
  if(v < r[0] || v > r[1]) return r[2]+' fuera de rango ('+r[0]+'–'+r[1]+')';
  return null;
}
function avisoRangos(ids){
  const malos = ids.map(fueraDeRango).filter(Boolean);
  if(!malos.length) return '';
  return '<div class="r" style="border-left:3px solid #ef4444;padding-left:8px">'
       + '<span class="k">⚠️ Revisá los datos</span><span class="v">'
       + malos.join(' · ') + '</span></div>';
}
function num(id){
  const v=parseFloat((el(id)||{}).value);
  if(isNaN(v)) return null;
  /* Un valor imposible NO se usa: es preferible un «—» a un número serio y
     falso, que es lo que hace daño. El aviso lo pone avisoRangos(). */
  if(fueraDeRango(id)) return null;
  return v;
}
function fmt(n,d=1){if(n===null||n===undefined||isNaN(n))return '—';return (Math.round(n*10**d)/10**d).toLocaleString('es-PE');}
function pill(t,cls){return `<span class="pill ${cls}">${t}</span>`;}

/* ---------- LÓGICA ---------- */
function row(k,v,unit='',extra=''){return `<div class="r"><span class="k">${k}</span><span class="v">${v}${unit?` <small>${unit}</small>`:''}${extra}</span></div>`;}

function vVent(){
  const sex=el('v_sex').value, h=num('v_h'), vt=num('v_vt'), fr=num('v_fr');
  const pplat=num('v_pplat'), peep=num('v_peep'), ppeak=num('v_ppeak'), maw=num('v_maw');
  const pao2=num('v_pao2'), fio2=num('v_fio2'), paco2=num('v_paco2'), pb=num('v_pb')||760;
  let o='';
  let pbw=null;
  if(h){pbw=(sex==='h'?50:45.5)+0.91*(h-152.4); pbw=Math.max(pbw,0);
    o+=row('Peso predicho (PBW)',fmt(pbw),'kg');
    o+=row('Vt objetivo 6 mL/kg',fmt(6*pbw,0),'mL',` <small>(4–8: ${fmt(4*pbw,0)}–${fmt(8*pbw,0)})</small>`);
    if(vt)o+=row('Vt actual / PBW',fmt(vt/pbw),'mL/kg', (vt/pbw>8?pill('alto','bad'):vt/pbw>6.5?pill('límite','warn'):pill('protector','ok')));
  }
  if(pplat!==null&&peep!==null){const dp=pplat-peep;
    o+=row('Driving pressure',fmt(dp),'cmH₂O',dp>15?pill('alto','bad'):pill('ok','ok'));
    if(vt)o+=row('Compliance estática',fmt(vt/dp),'mL/cmH₂O');
    if(vt&&fr&&ppeak!==null){const mp=0.098*fr*(vt/1000)*(ppeak-0.5*dp);
      o+=row('Mechanical power',fmt(mp),'J/min',mp>17?pill('alto','bad'):pill('ok','ok'));}
  }
  if(ppeak!==null&&pplat!==null)o+=row('Resistencia (Ppico−Pplat)',fmt(ppeak-pplat),'cmH₂O');
  if(pao2&&fio2){const pf=pao2/(fio2/100);
    /* Berlín (JAMA 2012, PMID 22797452) usa <=, no <: grave <=100, moderado
         100-200, leve 200-300. Con `<`, un P/F de exactamente 100 salía
         «moderado» siendo GRAVE, y uno de 300 salía «normal» en verde
         siendo SDRA leve. Son cifras redondas que aparecen a diario. */
      o+=row('PaO₂/FiO₂',fmt(pf,0),'', pf<=100?pill('SDRA grave','bad'):pf<=200?pill('SDRA mod','warn'):pf<=300?pill('SDRA leve','warn'):pill('normal','ok'));}
  if(fio2&&maw&&pao2)o+=row('Índice de oxigenación',fmt((fio2*maw)/pao2),'', ((fio2*maw)/pao2)>=16?pill('alto','bad'):pill('ok','ok'));
  if(fio2&&paco2&&pao2){const PAO2=(fio2/100)*(pb-47)-paco2/0.8; o+=row('Gradiente A-a',fmt(PAO2-pao2),'mmHg');}
  el('v_out').innerHTML=o||'<div class="r"><span class="k">Ingresa datos…</span></div>';
}

function vAB(){
  const ph=num('a_ph'),na=num('a_na'),cl=num('a_cl'),hco3=num('a_hco3'),alb=num('a_alb');
  const paco2=num('a_paco2'),glu=num('a_glu'),bun=num('a_bun'),osmM=num('a_osm');
  let o='';
  if(na&&cl&&hco3!==null){const ag=na-(cl+hco3);
    o+=row('Anion gap',fmt(ag),'mmol/L', ag>12?pill('elevado','warn'):pill('normal','ok'));
    let agc=ag;
    if(alb){agc=ag+2.5*(4-alb); o+=row('AG corregido (albúmina)',fmt(agc),'mmol/L', agc>12?pill('elevado','warn'):pill('normal','ok'));}
    const dd=(agc-12)/(24-hco3);
    /* El delta ratio SÓLO tiene sentido en una acidosis metabólica con
       anion gap ELEVADO: mide cuánto subió el AG contra cuánto bajó el
       bicarbonato. Con un AG normal no significa nada, y se mostraba con
       cualquier HCO₃<24, etiqueta incluida. */
    if(hco3<24 && agc>12) o+=row('Delta ratio (Δ/Δ)',fmt(dd,2),'', dd<0.4?pill('+ no-AG','warn'):dd>2?pill('+ alcalosis met','warn'):pill('AGMA pura','ok'));
    else if(hco3<24) o+=row('Delta ratio (Δ/Δ)','no aplica','', pill('el anion gap no está elevado','ok'));
  }
  /* ── COMPENSACIÓN, GUIADA POR EL pH ─────────────────────────────────
     ANTES se aplicaba Winter a cualquier HCO₃<22, SIN pH. Winter sólo vale
     si el trastorno PRIMARIO es acidosis metabólica. Una alcalosis
     respiratoria crónica (Na 140, Cl 112, HCO₃ 18, PaCO₂ 25 → pH 7,48)
     salía como «acidosis metabólica + alcalosis respiratoria añadida»:
     el diagnóstico al revés. Ahora se identifica primero el trastorno
     primario, y sólo entonces se aplica la regla que le corresponde. */
  if(ph===null){
    if(hco3!==null&&(hco3<22||hco3>26))
      o+=row('Compensación','—','', pill('falta el pH para saber el trastorno primario','warn'));
  }else{
    const acid=ph<7.35, alca=ph>7.45;
    const esp=(v,t)=>fmt(v-t,0)+'–'+fmt(v+t,0);
    const juzga=(v,t,real)=> real===null?'' :
      real>v+t?pill('además, componente respiratorio ácido','warn') :
      real<v-t?pill('además, componente respiratorio alcalino','warn') :
      pill('compensación adecuada','ok');
    const juzgaH=(a,c,real)=> real===null?'' :
      real>Math.max(a,c)+2?pill('+ alcalosis metabólica','warn') :
      real<Math.min(a,c)-2?pill('+ acidosis metabólica','warn') :
      pill('dentro de lo esperado','ok');
    if(acid && hco3!==null && hco3<22){
      const w=1.5*hco3+8;
      o+=row('Trastorno primario','acidosis metabólica','', pill('pH '+fmt(ph,2),'bad'));
      o+=row('PaCO₂ esperado (Winter)',esp(w,2),'mmHg', juzga(w,2,paco2));
    }else if(alca && hco3!==null && hco3>26){
      const w=0.7*hco3+21;
      o+=row('Trastorno primario','alcalosis metabólica','', pill('pH '+fmt(ph,2),'warn'));
      o+=row('PaCO₂ esperado',esp(w,2),'mmHg', juzga(w,2,paco2));
    }else if(acid && paco2!==null && paco2>45){
      const ag=24+1.0*(paco2-40)/10, cr=24+3.5*(paco2-40)/10;
      o+=row('Trastorno primario','acidosis respiratoria','', pill('pH '+fmt(ph,2),'bad'));
      o+=row('HCO₃ esperado','aguda '+fmt(ag,1)+' · crónica '+fmt(cr,1),'mmol/L', juzgaH(ag,cr,hco3));
    }else if(alca && paco2!==null && paco2<35){
      const ag=24-2.0*(40-paco2)/10, cr=24-4.0*(40-paco2)/10;
      o+=row('Trastorno primario','alcalosis respiratoria','', pill('pH '+fmt(ph,2),'warn'));
      o+=row('HCO₃ esperado','aguda '+fmt(ag,1)+' · crónica '+fmt(cr,1),'mmol/L', juzgaH(ag,cr,hco3));
    }else if(!acid && !alca && hco3!==null && (hco3<22||hco3>26)){
      o+=row('Trastorno primario','pH normal con HCO₃ alterado','', pill('sospechá trastorno mixto','warn'));
    }
  }
  if(na&&glu!==null&&bun!==null){const oc=2*na+glu/18+bun/2.8;
    o+=row('Osmolaridad calculada',fmt(oc,0),'mOsm/kg');
    if(osmM)o+=row('Gap osmolar',fmt(osmM-oc),'', (osmM-oc)>10?pill('elevado','bad'):pill('normal','ok'));
  }
  el('a_out').innerHTML=o||'<div class="r"><span class="k">Ingresa datos…</span></div>';
}

function vNa(){
  const na=num('n_na'),glu=num('n_glu'),kg=num('n_kg'),goal=num('n_goal');
  const sv=el('n_sex').value, factor=sv==='0.5b'?0.5:parseFloat(sv);
  const fluid=parseFloat(el('n_fluid').value);
  let o='';
  if(na&&glu!==null){const fg=glu>400?2.4:1.6;o+=row('Na⁺ corregido (glucosa)',fmt(na+fg*((glu-100)/100)),'mmol/L',glu>400?pill('factor 2,4 (Hillier)','warn'):'');}
  let act=null;
  if(kg){act=kg*factor; o+=row('Agua corporal total',fmt(act),'L');}
  if(act&&na){
    if(na>145)o+=row('Déficit de agua libre',fmt(act*(na/140-1)),'L');
    const kadd=num('n_kadd')||0;const dNa=(fluid+kadd-na)/(act+1);
    o+=row('ΔNa⁺ por 1 L (Adrogué)',fmt(dNa,2),'mmol/L', Math.abs(dNa)>0?'':'' );
    if(goal&&Math.abs(dNa)>0.01){const need=(goal-na)/dNa; o+=row('Vol. para llegar al objetivo',fmt(need,2),'L');}
  }
  if(act&&na&&goal&&na<135)o+=row('Déficit de Na⁺',fmt(act*(goal-na),0),'mmol');
  el('n_out').innerHTML=o||'<div class="r"><span class="k">Ingresa datos…</span></div>';
}

function vRen(){
  const age=num('r_age'),kg=num('r_kg'),cr=num('r_cr'),sex=el('r_sex').value;
  const una=num('r_una'),ucr=num('r_ucr'),uur=num('r_uur'),pur=num('r_pur');
  let o='';
  if(age&&kg&&cr){let cg=((140-age)*kg)/(72*cr); if(sex==='m')cg*=0.85;
    o+=row('Cockcroft-Gault (ClCr)',fmt(cg,0),'mL/min');}
  if(age&&cr){const k=sex==='m'?0.7:0.9, a=sex==='m'?-0.241:-0.302;
    let egfr=142*Math.pow(Math.min(cr/k,1),a)*Math.pow(Math.max(cr/k,1),-1.200)*Math.pow(0.9938,age);
    if(sex==='m')egfr*=1.012;
    o+=row('CKD-EPI 2021 (eGFR)',fmt(egfr,0),'mL/min/1,73', egfr<15?pill('G5','bad'):egfr<30?pill('G4','bad'):egfr<60?pill('G3','warn'):pill('G1-2','ok'));}
  const pna=num('r_una')!==null?num('n_na'):null; // no usado
  const naP=num('a_na'); // reutiliza si existe
  /* ANTES: `num('a_na')||140` — si no habías llenado el sodio en la OTRA
     pestaña, asumía 140 EN SILENCIO. Con un Na real de 125 el FeNa salía un
     12% equivocado y nada lo advertía. Ahora se pide, y si no está, se dice. */
  if(una!==null&&ucr&&cr){
    const PNa=num('a_na');
    if(PNa===null){
      o+=row('FeNa','—','', pill('falta el Na del plasma (pestaña Gasometría)','warn'));
    }else{
      const fena=(una*cr)/(PNa*ucr)*100;
      o+=row('FeNa',fmt(fena,2),'%', fena<1?pill('prerrenal','ok'):fena>2?pill('NTA','warn'):pill('indeterm.','warn'));
    }}
  if(uur&&pur&&ucr&&cr){const feu=(uur*cr)/(pur*ucr)*100;
    o+=row('FeUrea',fmt(feu,1),'%', feu<35?pill('prerrenal','ok'):pill('intrínseco','warn'));}
  el('r_out').innerHTML=o||'<div class="r"><span class="k">Ingresa datos…</span></div>';
}

function vVaso(){
  const sbp=num('p_sbp'),dbp=num('p_dbp'),hr=num('p_hr'),kg=num('p_kg');
  const mg=num('p_mg'),vol=num('p_vol'),dose=num('p_dose'),rate=num('p_rate');
  const epi=num('p_epi')||0,dopa=num('p_dopa')||0,phe=num('p_phe')||0,vp=num('p_vp')||0;
  let o='';
  if(sbp&&dbp)o+=row('PAM',fmt((sbp+2*dbp)/3,0),'mmHg', ((sbp+2*dbp)/3)<65?pill('baja','bad'):pill('ok','ok'));
  if(hr&&sbp){const si=hr/sbp;o+=row('Shock index',fmt(si,2),'', si>=0.9?pill('alto riesgo','bad'):si>0.7?pill('elevado','warn'):pill('normal','ok'));}
  if(mg&&vol){const conc=(mg*1000)/vol; // µg/mL
    o+=row('Concentración NA',fmt(conc,0),'µg/mL');
    if(dose&&kg)o+=row('→ Velocidad',fmt(dose*kg*60/conc,1),'mL/h');
    if(rate&&kg)o+=row('→ Dosis',fmt(rate*conc/(kg*60),3),'µg/kg/min');
  }
  /* La dosis de noradrenalina puede venir por el campo de dosis O deducirse
     de la velocidad. Antes se usaba sólo `dose`: si metías mL/h, la
     noradrenalina contaba CERO y un paciente a 0,5 µg/kg/min salía sin la
     etiqueta de «shock refractario». Infra-estimaba la gravedad justo en el
     caso peor. */
  let naDosis = dose||0;
  if(!naDosis && rate && kg && mg && vol) naDosis = rate*((mg*1000)/vol)/(kg*60);
  const na=naDosis+epi+phe/10+dopa/100+vp*2.5;
  if(na>0)o+=row('Equivalentes de NA',fmt(na,3),'µg/kg/min', na>0.5?pill('shock refractario','bad'):na>0.25?pill('alto','warn'):pill('','ok'));
  el('p_out').innerHTML=o||'<div class="r"><span class="k">Ingresa datos…</span></div>';
}

function vScores(){
  // qSOFA
  let q=0; document.querySelectorAll('#q_seg button.on').forEach(b=>q+=parseInt(b.dataset.v));
  el('q_out').innerHTML=row('qSOFA',q,'/3', q>=2?pill('alto riesgo','bad'):pill('bajo','ok'));
  // GCS
  const g=parseInt(el('g_e').value)+parseInt(el('g_v').value)+parseInt(el('g_m').value);
  el('g_out').innerHTML=row('Glasgow',g,'/15', g<=8?pill('grave','bad'):g<=12?pill('moderado','warn'):pill('leve','ok'));
  // SOFA
  let s=0;['s_resp','s_plt','s_bil','s_cv','s_gcs','s_ren'].forEach(id=>s+=parseInt(el(id).value));
  el('s_out').innerHTML=row('SOFA total',s,'/24', s>=12?pill('mortalidad alta','bad'):s>=6?pill('elevado','warn'):pill('bajo','ok'));
}

function vNut(){
  const ca=num('e_ca'),alb=num('e_alb');
  el('e_out').innerHTML=(ca&&alb!==null)?row('Ca corregido',fmt(ca+0.8*(4-alb),2),'mg/dL'):'<div class="r"><span class="k">Ingresa datos…</span></div>';
  const kg=num('u_kg'),kc=parseFloat(el('u_kcal').value),pr=parseFloat(el('u_pro').value);
  let o='';
  if(kg){o+=row('Energía',`${fmt(kg*kc,0)}`,'kcal/día');o+=row('Proteína',`${fmt(kg*pr,0)}`,'g/día');}
  el('u_out').innerHTML=o||'<div class="r"><span class="k">Ingresa peso…</span></div>';
}

/* ---------- RENDER ---------- */
const tabs=el('tabs'), main=el('main');
MODS.forEach((m,i)=>{
  const b=document.createElement('button'); b.className='tab'+(i===0?' on':''); b.textContent=m.tab;
  b.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));b.classList.add('on');
    document.querySelectorAll('section').forEach(s=>s.classList.remove('on'));el('sec_'+m.id).classList.add('on');};
  tabs.appendChild(b);
  const sec=document.createElement('section'); sec.id='sec_'+m.id; sec.className='sec'+(i===0?' on':''); sec.innerHTML=m.html;
  main.appendChild(sec);
});
// segmented multi-toggle (qSOFA)
document.querySelectorAll('.seg[data-multi] button').forEach(b=>b.onclick=()=>{b.classList.toggle('on');recalc();});
function recalc(){MODS.forEach(m=>{try{m.calc();}catch(e){}});}
main.addEventListener('input',recalc);
main.addEventListener('change',recalc);
recalc();
</script>
